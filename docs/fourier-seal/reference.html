    #biba-fourier-sculpture { --fs-bg:#0d1620; --fs-panel:#14232e; --fs-inset:#0a131c; --fs-line:#2b424f; --fs-text:#e4eeeb; --fs-muted:#9bb1bd; --fs-accent:#71e5ce; --fs-ghost:#bba8d9; font:14px/1.45 BibaGolos,Arial,sans-serif; color:var(--fs-text); }
    #biba-fourier-sculpture * { box-sizing:border-box; }
    #biba-fourier-sculpture .fs-app { background:radial-gradient(ellipse at 28% 38%,#192e3c 0,transparent 55%),var(--fs-bg); border:1px solid var(--fs-line); border-radius:12px; padding:24px; }
    #biba-fourier-sculpture .fs-header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-right:88px; margin-bottom:20px; }
    #biba-fourier-sculpture .fs-brand { color:var(--fs-accent); font:500 11px BibaTektur,Arial,sans-serif; letter-spacing:.13em; }
    #biba-fourier-sculpture h2 { font:500 27px/1.2 BibaTektur,Arial,sans-serif; margin:5px 0 0; }
    #biba-fourier-sculpture button,#biba-fourier-sculpture input { font:inherit; }
    #biba-fourier-sculpture button { color:inherit; }
    #biba-fourier-sculpture .fs-small { font-size:12px; color:var(--fs-muted); }
    #biba-fourier-sculpture .fs-header-detail { text-align:right; }
    #biba-fourier-sculpture .fs-parts { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; }
    #biba-fourier-sculpture .fs-part { min-width:0; padding:9px 10px; border:1px solid var(--fs-line); border-radius:5px; background:#15242f; text-align:left; }
    #biba-fourier-sculpture .fs-part[aria-pressed="true"] { border-color:var(--fs-accent); background:#213a43; }
    #biba-fourier-sculpture .fs-part-name { display:block; font-size:12px; }
    #biba-fourier-sculpture .fs-part-count { display:block; margin-top:4px; font-size:11px; color:var(--fs-muted); }
    #biba-fourier-sculpture .fs-main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:25px; margin-top:18px; }
    #biba-fourier-sculpture .fs-shape-panel { min-width:0; }
    #biba-fourier-sculpture .fs-shape-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    #biba-fourier-sculpture .fs-shape-heading strong { font-weight:500; }
    #biba-fourier-sculpture .fs-btn { border:1px solid #395360; border-radius:5px; background:#20333f; padding:7px 11px; white-space:nowrap; }
    #biba-fourier-sculpture .fs-btn[aria-pressed="true"] { background:#28454a; border-color:#5c9d94; }
    #biba-fourier-sculpture .fs-btn:disabled { opacity:.4; }
    #biba-fourier-sculpture .fs-wheel { width:100%; height:370px; display:block; }
    #biba-fourier-sculpture .fs-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; color:var(--fs-muted); font-size:11px; }
    #biba-fourier-sculpture .fs-legend span { display:flex; align-items:center; gap:6px; }
    #biba-fourier-sculpture .fs-swatch { width:17px; height:2px; background:var(--fs-accent); }
    #biba-fourier-sculpture .fs-swatch-target { background:var(--fs-ghost); }
    #biba-fourier-sculpture .fs-coeffs { display:grid; gap:8px; }
    #biba-fourier-sculpture .fs-coeff { border:1px solid var(--fs-line); border-radius:6px; background:#14232e; display:grid; grid-template-columns:104px minmax(0,1fr); gap:10px; padding:7px 10px 7px 7px; align-items:center; }
    #biba-fourier-sculpture .fs-coeff[data-active="true"] { border-color:#638d8a; background:#1a3039; }
    #biba-fourier-sculpture .fs-disk { width:104px; height:104px; border:0; padding:0; background:transparent; touch-action:none; }
    #biba-fourier-sculpture .fs-disk svg { width:104px; height:104px; display:block; user-select:none; }
    #biba-fourier-sculpture .fs-coeff-title { display:block; color:var(--fs-text); font-weight:500; margin-bottom:4px; }
    #biba-fourier-sculpture .fs-coeff-number { color:var(--fs-accent); font-family:BibaTektur,Arial,sans-serif; }
    #biba-fourier-sculpture .fs-values { font-variant-numeric:tabular-nums; font-size:12px; color:var(--fs-muted); }
    #biba-fourier-sculpture .fs-complex { font-size:11px; color:var(--fs-muted); margin-top:3px; font-variant-numeric:tabular-nums; }
    #biba-fourier-sculpture .fs-edit { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:15px 0; margin-top:15px; border-top:1px solid var(--fs-line); }
    #biba-fourier-sculpture .fs-label { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--fs-muted); margin-bottom:5px; }
    #biba-fourier-sculpture input[type="range"] { width:100%; margin:0; display:block; accent-color:var(--fs-accent); }
    #biba-fourier-sculpture .fs-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    #biba-fourier-sculpture .fs-action-pair { display:flex; gap:5px; align-items:center; }
    #biba-fourier-sculpture .fs-action-label { color:var(--fs-muted); font-size:11px; margin-right:2px; }
    #biba-fourier-sculpture .fs-undo { margin-left:auto; }
    #biba-fourier-sculpture .fs-score-panel { margin-top:18px; padding-top:15px; border-top:1px solid var(--fs-line); }
    #biba-fourier-sculpture .fs-score-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; font-size:12px; }
    #biba-fourier-sculpture .fs-match { color:var(--fs-accent); font-variant-numeric:tabular-nums; }
    #biba-fourier-sculpture .fs-score { width:100%; height:142px; display:block; margin-top:6px; }
    #biba-fourier-sculpture .fs-footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:8px; font-size:11px; color:var(--fs-muted); }
    #biba-fourier-sculpture .fs-wheel text,#biba-fourier-sculpture .fs-score text,#biba-fourier-sculpture .fs-disk text { font-family:BibaGolos,Arial,sans-serif; }
    @media(max-width:800px) { #biba-fourier-sculpture .fs-app { padding:18px; } #biba-fourier-sculpture .fs-main { grid-template-columns:minmax(0,1fr) 255px; gap:14px; } #biba-fourier-sculpture .fs-coeff { grid-template-columns:88px minmax(0,1fr); padding:6px; gap:6px; } #biba-fourier-sculpture .fs-disk,#biba-fourier-sculpture .fs-disk svg { width:88px; height:88px; } #biba-fourier-sculpture .fs-wheel { height:330px; } #biba-fourier-sculpture h2 { font-size:23px; } #biba-fourier-sculpture .fs-header-detail { display:none; } #biba-fourier-sculpture .fs-parts { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media(max-width:590px) { #biba-fourier-sculpture .fs-app { padding:16px 12px; } #biba-fourier-sculpture .fs-header { padding-right:74px; } #biba-fourier-sculpture h2 { font-size:21px; } #biba-fourier-sculpture .fs-brand { font-size:11px; letter-spacing:.05em; } #biba-fourier-sculpture .fs-main { grid-template-columns:1fr; } #biba-fourier-sculpture .fs-wheel { height:300px; } #biba-fourier-sculpture .fs-coeffs { gap:6px; grid-template-columns:repeat(3,minmax(0,1fr)); } #biba-fourier-sculpture .fs-coeff { display:flex; flex-direction:column; gap:3px; padding:6px 2px; text-align:center; } #biba-fourier-sculpture .fs-coeff-title { font-size:11px; } #biba-fourier-sculpture .fs-coeff-caption { display:none; } #biba-fourier-sculpture .fs-values { font-size:11px; } #biba-fourier-sculpture .fs-complex { display:none; } #biba-fourier-sculpture .fs-disk,#biba-fourier-sculpture .fs-disk svg { width:76px; height:76px; } #biba-fourier-sculpture .fs-action-label { display:none; } #biba-fourier-sculpture .fs-undo { margin-left:0; } #biba-fourier-sculpture .fs-part { padding:8px 6px; } #biba-fourier-sculpture .fs-part-name { font-size:11px; } }
