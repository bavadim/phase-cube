<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>XronoMorph · лаборатория ритма</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=xrono1">
</head>
<body>
<main id="xrono-lab" data-build="xronomorph/lab1">
  <header class="topbar">
    <div><a class="back" href="../">← Головоломки</a><h1>XronoMorph</h1></div>
    <div class="transport"><span id="audio-state" role="status">Готов к прослушиванию</span><button type="button" id="play" class="primary" aria-pressed="false">Слушать</button></div>
  </header>
  <nav class="mode-tabs" aria-label="Математическая модель">
    <button type="button" data-mode="pb" aria-pressed="true">Баланс фигур · PB</button>
    <button type="button" data-mode="wf" aria-pressed="false">Длинные / короткие · WF</button>
  </nav>
  <div class="global-controls">
    <label>Скорость цикла <span><input id="rpm" type="range" min="8" max="90" step=".1" value="30"><output id="rpm-value" for="rpm">30 об/мин · 2 с</output></span></label>
    <label>Общая громкость <span><input id="volume" type="range" min="0" max="1" step=".01" value=".85"><output id="volume-value" for="volume">85%</output></span></label>
  </div>
  <section id="wf-controls" class="wf-controls" aria-label="Параметры иерархии" hidden>
    <label>Длинных <input id="longs" type="number" min="1" max="8" value="1"></label>
    <label>Коротких <input id="shorts" type="number" min="1" max="8" value="1"></label>
    <label class="ratio-control">Отношение L / s <span><input id="ratio" type="range" min="1" max="8" step=".001" value="1.618"><input id="ratio-number" type="number" min="1" max="8" step=".001" aria-label="Точное отношение длинного интервала к короткому"></span></label>
    <div class="ratio-presets" aria-label="Отношения интервалов"><button type="button" data-ratio="1">1:1</button><button type="button" data-ratio="1.5">3:2</button><button type="button" data-ratio="phi">φ</button><button type="button" data-ratio="2">2:1</button></div>
  </section>
  <section class="workspace">
    <div class="diagram-panel">
      <svg id="diagram" role="img" aria-label="Ритмические слои как цветные многоугольники на общей окружности. Перетаскивание вершины вращает фигуру целиком."></svg>
      <p id="geometry-status" class="geometry-status" aria-live="polite"></p>
      <p id="gesture-help" class="help">Выберите фигуру и потяните любую её точку по окружности.</p>
    </div>
    <aside class="editor" aria-label="Ритмические слои">
      <div class="layer-heading"><h2>Слои</h2><button type="button" id="add-layer">+ Слой</button></div>
      <div id="layers" class="layers"></div>
      <section class="selected-editor" aria-labelledby="selected-title">
        <h2 id="selected-title">Слой 1</h2>
        <label id="shape-label">Фигура <select id="shape"></select></label>
        <label><span id="phase-label">Поворот фигуры</span><span><input id="phase" type="range" min="0" max="359.9" step=".1"><output id="phase-value" for="phase">0°</output></span></label>
        <label id="snap-label">Привязка вращения <select id="snap"><option value="0">Свободно</option><option value="12">12 позиций</option><option value="16">16 позиций</option><option value="24">24 позиции</option><option value="30">30 позиций</option></select></label>
        <div id="hierarchy-options" class="hierarchy-options" hidden>
          <label><input type="checkbox" id="complement"> Только новые удары · C</label>
          <label><input type="checkbox" id="reverse"> Обратное деление · L/R</label>
        </div>
        <label>Звук <select id="instrument"></select></label>
        <div class="note-gate">
          <label>Нота MIDI <input id="note" type="number" min="24" max="96"></label>
          <label>Длительность, мс <input id="gate" type="number" min="20" max="800" step="5"></label>
        </div>
        <label>Сила удара <span><input id="velocity" type="range" min="0" max="1" step=".01"><output id="velocity-value" for="velocity"></output></span></label>
      </section>
    </aside>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
  <footer>Математическая модель: <a href="https://research-management.mq.edu.au/ws/portalfiles/portal/90170882/Publisher_version.pdf" target="_blank" rel="noreferrer">Milne и соавторы, XronoMorph, 2016</a> · собственная браузерная реализация · звук: Strudel.</footer>
</main>
<script src="../vendor/strudel-web-1.3.0.js"></script>
<script src="model.js?v=xrono1"></script>
<script src="transport.js?v=xrono1"></script>
<script src="view.js?v=xrono1"></script>
<script src="app.js?v=xrono1"></script>
</body>
</html>
