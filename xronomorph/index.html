<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Круг ритма · сбалансированное деление</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=collapse1">
</head>
<body>
<main id="xrono-lab" data-build="balanced-rhythm/1">
  <header class="topbar">
    <div><a class="back" href="../">← Головоломки</a><h1>Круг ритма</h1></div>
    <div class="transport"><span id="audio-state" role="status">Готов к прослушиванию</span><button type="button" id="play" class="primary" aria-pressed="false">Слушать</button></div>
  </header>
  <div class="global-controls">
    <label>Скорость цикла <span><input id="rpm" type="range" min="8" max="90" step=".1" value="30"><output id="rpm-value" for="rpm">30 об/мин · 2 с</output></span></label>
    <label>Общая громкость <span><input id="volume" type="range" min="0" max="1" step=".01" value="1"><output id="volume-value" for="volume">100%</output></span></label>
  </div>
  <div id="migration" class="migration" hidden><p id="migration-text"></p><button id="download-legacy" type="button">Скачать прежний рисунок</button></div>
  <section class="workspace">
    <div class="diagram-panel">
      <div class="packet-tools" aria-label="Как делить"><button type="button" data-order="2" aria-pressed="true">Пара · +2</button><button type="button" data-order="3" aria-pressed="false">Тройка · +3</button><button type="button" id="collapse-mode" aria-pressed="false">− Схлопнуть</button></div>
      <svg id="diagram" role="group" aria-label="Круг ритма: ноты вращают инструмент, плюс добавляет связанную пару или тройку, минус схлопывает группу."></svg>
      <p id="preview-status" class="preview-status" aria-live="polite"></p>
      <p id="geometry-status" class="geometry-status" aria-live="polite"></p>
      <p id="gesture-help" class="help"></p>
      <div class="edit-tools"><button type="button" id="undo" disabled>Отменить</button></div>
    </div>
    <aside class="editor" aria-label="Инструменты">
      <h2>Инструменты</h2>
      <div id="layers" class="layers"></div>
      <section class="construction"><h2>Дерево выбранного инструмента</h2><p id="tree-empty" class="help">Первый «+» создаст пару или тройку.</p><ol id="group-tree" class="group-tree"></ol></section>
    </aside>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
  <footer>Один оборот — один цикл · связанные пары и тройки сохраняют центр тяжести · звук: Strudel.</footer>
</main>
<script src="../vendor/strudel-web-1.3.0.js"></script>
<script src="model.js?v=collapse1"></script>
<script src="transport.js?v=collapse1"></script>
<script src="view.js?v=collapse1"></script>
<script src="app.js?v=collapse1"></script>
</body>
</html>
