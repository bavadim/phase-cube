<main class="workshop">

  <div class="toolbar">

    </div>

  <p id="notice" role="status" hidden></p>
  <footer><span>Пара шестерёнок задаёт скорость партии. Касание ставит ноту, перетаскивание меняет её время и высоту, правый край — длительность.</span><a href="disc/index.html?view=gears">К шестерёнкам <span aria-hidden="true">↗</span></a></footer>
