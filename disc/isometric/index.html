<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <base href="../../">
  <title>Нотный конвейер · Биба</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="disc/isometric/style.css?v=rows1">
  <link rel="stylesheet" href="disc/isometric/scene.css?v=rows1">
  <link rel="stylesheet" href="disc/isometric/face.css?v=rows1">
</head>
<body>
  <main class="workshop" aria-label="Нотный конвейер">
    <section class="bench" aria-label="Музыкальная машина">
      <div id="board" role="group" aria-label="Музыкальный верстак"></div>
      <div class="context-dock" role="group" aria-label="Действия на верстаке">
        <div class="aux-actions">
          <details id="workbench-menu">
            <summary class="tool utility" aria-label="Меню верстака">
              <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></g></svg>
            </summary>
            <div class="menu-sheet">
              <label class="menu-preset" id="assembly">Сборка
                <select id="preset"><option value="hydraulic">Дозатор и эхо</option><option value="duet">Дуэт</option><option value="straight">Прямая линия</option><option value="echo">Эхо с развилкой</option><option value="answer">Отложенный ответ</option><option value="custom" hidden>Своя разводка</option></select>
              </label>
              <a id="return-to-shop" href="disc/line/index.html">Вернуться в цех</a>
            </div>
          </details>
          <button class="tool utility" type="button" id="undo" aria-label="Отменить правку" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5m-4-5h9a5 5 0 0 1 0 10h-2"/></svg>
          </button>
          <button class="tool utility" type="button" id="unplug" aria-label="Снять шланг" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 21 4-4m10-10 4-4M7 11l6 6-2 2a3 3 0 0 1-4-1l-1-1a3 3 0 0 1 0-4zm10 2-6-6 2-2a3 3 0 0 1 4 0l2 2a3 3 0 0 1 0 4z"/></svg><span>Снять шланг</span>
          </button>
        </div>
        <div class="primary-actions">
          <button class="tool play" type="button" id="play" disabled aria-pressed="false" aria-label="Запустить">
            <span id="mix-glass" class="mix-glass" aria-hidden="true" data-pitches=""></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="triangle" d="M7 4 21 12 7 20Z"/><path class="bars" d="M5 4h4v16H5zm10 0h4v16h-4z"/></svg>
          </button>
          <button class="tool done" type="button" id="back-to-table" aria-label="ОК — вернуться ко всей машине" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6"/></svg>ОК
          </button>
          <button class="tool cancel" type="button" id="cancel-mode" hidden>Отмена</button>
        </div>
      </div>
      <div class="sr-only" id="status" role="status"></div>
      <p id="notice" role="alert" hidden></p>
    </section>
  </main>
  <script src="vendor/three-0.160.1.min.js"></script>
  <script src="vendor/strudel-web-1.3.0.js"></script>
  <script src="audio-bank.js?v=cam-audio2"></script>
  <script src="async-task.js"></script>
  <script src="transport.js?v=conveyor1"></script>
  <script src="disc/isometric/flow.js?v=rows1"></script>
  <script src="disc/isometric/layout.js?v=rows1"></script>
  <script src="disc/conveyor/audition.js?v=rows1"></script>
  <script src="disc/isometric/sound.js?v=rows1"></script>
  <script src="disc/isometric/pieces.js?v=rows1"></script>
  <script src="disc/isometric/belts.js?v=rows1"></script>
  <script src="disc/isometric/face.js?v=rows1"></script>
  <script src="disc/isometric/hose-gesture.js?v=rows1"></script>
  <script src="disc/isometric/scene.js?v=rows1"></script>

  <script src="disc/isometric/flat.js?v=rows1"></script>
  <script src="disc/isometric/app.js?v=rows1"></script>
</body>
</html>
