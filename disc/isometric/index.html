<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <base href="../../">
  <title>Нотный конвейер · Биба</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="disc/isometric/style.css">
  <link rel="stylesheet" href="disc/isometric/scene.css">
</head>
<body>
  <main class="workshop">
    <header class="mast">
      <div><a class="back" href="disc/line/index.html">← Ударный цех</a><h1>Нотный конвейер</h1></div>
      <div class="transport">
        <button id="undo" class="round" disabled title="Отменить правку (Ctrl+Z)" aria-label="Отменить правку"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5m-4-5h9a5 5 0 0 1 0 10h-2"/></svg></button>
        <button id="play" class="play" disabled aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="triangle" d="M5 3 17 10 5 17Z"/><path class="bars" d="M4 3h4v14H4zm8 0h4v14h-4z"/></svg><span>Запустить</span></button>
      </div>
    </header>
    <section class="bench" aria-label="Музыкальная машина">
      <div class="bench-head">
        <label class="assembly">Сборка
          <select id="preset" aria-label="Сборка"><option value="echo">Эхо под щупом</option><option value="answer">Отложенный ответ</option><option value="straight">Прямая линия</option><option value="custom" hidden>Своя разводка</option></select>
        </label>
        <div class="meter" aria-hidden="true"><span class="beat-lights" id="beat"></span><span class="tempo">112 BPM</span></div>
      </div>
      <div id="board" role="group" aria-label="Изометрическая модель конвейера"></div>
      <div class="bench-foot">
        <p id="guidance" role="status">Запустите машину. Коснитесь детали, чтобы её настроить.</p>
        <button id="cancel-patch" type="button" hidden>Отмена соединения</button>
      </div>
      <p id="notice" role="alert" hidden></p>
    </section>
    <section class="editor" aria-label="Редактор деталей">
      <div class="editor-head">
        <label for="part">Деталь</label><select id="part"><option value="">Выберите на столе</option></select>
      </div>
      <div id="settings"></div>
    </section>
  </main>
  <script src="vendor/three-0.160.1.min.js"></script>
  <script src="vendor/strudel-web-1.3.0.js"></script>
  <script src="audio-bank.js"></script>
  <script src="async-task.js"></script>
  <script src="transport.js?v=conveyor1"></script>
  <script src="disc/isometric/flow.js"></script>
  <script src="disc/isometric/sound.js"></script>
  <script src="disc/isometric/pieces.js"></script>
  <script src="disc/isometric/belts.js"></script>
  <script src="disc/isometric/scene.js"></script>
  <script src="disc/isometric/app.js"></script>
</body>
</html>
