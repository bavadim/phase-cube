<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <base href="../../">
  <title>Нотный конвейер · Биба</title>
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="disc/isometric/scene.css?v=camwire1">
  <link rel="stylesheet" href="disc/isometric/face.css?v=camwire1">
</head>
<body>
  <main class="workshop" aria-label="Нотный конвейер">
    <section class="bench" aria-label="Музыкальная машина">
      <nav class="rail" aria-label="Управление верстаком">
        <div class="view-tools">
          <a class="tool" id="return-to-shop" aria-label="Вернуться в ударный цех" href="disc/line/index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4H5v16h9M9 12h12m-5-5 5 5-5 5" transform="rotate(180 12 12)"/></svg>
          </a>
          <button class="tool" type="button" id="back-to-table" aria-label="Показать весь стол" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 12 10-6 10 6-10 6zm2 3.8 8 4.7 8-4.7M2 6V2h4m16 4V2h-4"/></svg>
          </button>
          <label class="tool picker" id="assembly">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="5" height="6" rx="1.1"/><rect x="17" y="2" width="5" height="6" rx="1.1"/><rect x="17" y="15" width="5" height="6" rx="1.1"/><path d="M7 11h3.5l3.3-6H17m-6.5 6 3.3 7H17"/></svg>
            <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
            <select id="preset" aria-label="Выбрать сборку"><option value="duet">Дуэт</option><option value="straight">Прямая линия</option><option value="echo">Эхо с развилкой</option><option value="answer">Отложенный ответ</option><option value="custom" hidden>Своя разводка</option></select>
          </label>
          <button class="tool" id="mount-part" type="button" aria-label="Вставить деталь в соединение" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v8m-3-3 3 3 3-3M2 15h5m10 0h5"/><rect x="7" y="11" width="10" height="8" rx="2"/></svg>
          </button>
          <button class="tool" id="bypass-part" type="button" aria-label="Соединить в обход детали" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h3c2 0 2-7 5-7h4c4 0 3 7 6 7h2m-3-3 3 3-3 3"/><rect x="8" y="11" width="8" height="7" rx="2" stroke-dasharray="2 3"/></svg>
          </button>
          <button class="tool" id="unplug" type="button" aria-label="Отсоединить провод" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 21 4-4m10-10 4-4M7 11l6 6-2 2a3 3 0 0 1-4-1l-1-1a3 3 0 0 1 0-4zm10 2-6-6 2-2a3 3 0 0 1 4 0l2 2a3 3 0 0 1 0 4z"/></svg>
          </button>
          <button class="tool" id="cancel-mode" type="button" aria-label="Отменить монтаж" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <span id="beat" class="beat-lights" aria-hidden="true"></span>
        <div class="transport">
          <button class="tool" id="undo" disabled aria-label="Отменить правку">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5m-4-5h9a5 5 0 0 1 0 10h-2"/></svg>
          </button>
          <button class="tool play" id="play" disabled aria-pressed="false" aria-label="Запустить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="triangle" d="M7 4 21 12 7 20Z"/><path class="bars" d="M5 4h4v16H5zm10 0h4v16h-4z"/></svg>
          </button>
        </div>
      </nav>
      <div id="board" role="group" aria-label="Музыкальный верстак"></div>
      <div class="sr-only" id="status" role="status"></div>
      <p id="notice" role="alert" hidden></p>
    </section>
  </main>
