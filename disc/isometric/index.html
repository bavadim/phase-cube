<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <base href="../../">
  <title>Нотный конвейер · Биба</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="disc/isometric/style.css?v=turnout1">
  <link rel="stylesheet" href="disc/isometric/scene.css?v=turnout1">
</head>
<body>
  <main class="workshop">
    <header class="mast">
      <div><a class="back" href="disc/line/index.html">← Ударный цех</a><h1>Нотный конвейер</h1></div>
      <div class="transport">
        <button id="undo" class="round" disabled title="Отменить правку (Ctrl+Z)" aria-label="Отменить правку"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5m-4-5h9a5 5 0 0 1 0 10h-2"/></svg></button>
        <button id="play" class="play" disabled aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="triangle" d="M5 3 17 10 5 17Z"/><path class="bars" d="M4 3h4v14H4zm8 0h4v14h-4z"/></svg><span>Запустить</span></button>
      </div>
    </header>
    <div class="console">
      <section class="bench" aria-label="Музыкальная машина">
        <div class="bench-head">
          <label class="assembly">Сборка <select id="preset"><option value="duet">Дуэт</option><option value="straight">Прямая линия</option><option value="echo">Эхо с развилкой</option><option value="answer">Отложенный ответ</option><option value="custom" hidden>Своя разводка</option></select></label>
          <div class="meter"><span class="beat-lights" id="beat" aria-hidden="true"></span><span class="tempo">112 BPM</span></div>
        </div>
        <div id="board" role="group" aria-label="Изометрическая модель конвейера"></div>
        <div class="bench-foot"><span id="guide-icon" aria-hidden="true">↗</span><p id="guidance" role="status">Коснитесь детали, чтобы открыть её управление.</p><button id="cancel-mode" type="button" hidden>Отмена</button></div>
      </section>
      <section class="editor" aria-label="Управление выбранной деталью">
        <div class="editor-head"><span id="part-icon" aria-hidden="true"></span><label><span>Деталь</span><select id="part" aria-label="Выбранная деталь"></select></label></div>
        <div id="settings"></div>
        <p id="notice" role="alert" hidden></p>
      </section>
    </div>
  </main>
  <script src="vendor/three-0.160.1.min.js"></script>
  <script src="vendor/strudel-web-1.3.0.js"></script>
  <script src="audio-bank.js"></script>

  <script src="disc/isometric/sound.js?v=turnout1"></script>
  <script src="disc/isometric/pieces.js?v=turnout1"></script>
  <script src="disc/isometric/belts.js?v=turnout1"></script>
  <script src="disc/isometric/scene.js?v=turnout1"></script>
  <script src="disc/isometric/panel.js?v=turnout1"></script>
  <script src="disc/isometric/app.js?v=turnout1"></script>
</body>
</html>
