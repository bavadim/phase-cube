<main class="app" aria-label="Музыкальная головоломка">
  <header class="game-status" aria-label="Прогресс">
    <div class="completion" aria-label="Прогресс сборки"><span id="correct-count">0</span><span id="progress-label" role="status">деталей<br>на месте</span></div>
  </header>
  <section class="playfield" aria-label="Головоломка и музыкальный рисунок">
    <div class="orbital-workspace" id="orbital-workspace">
      <div class="orbit-sequencer" id="orbit-sequencer">

        <div class="puzzle-stage" id="puzzle-stage" tabindex="0"></div>
      </div>
    </div>
  </section>
  <footer class="controls-dock" id="player-controls" aria-label="Управление"></footer>
</main>

<output id="audio-diagnostics" hidden aria-hidden="true"></output>
