<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Музыкальные головоломки из Strudel-композиций.">
  <meta name="color-scheme" content="light">
  <title>Музыкальная головоломка</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=contracts1">
  <link rel="stylesheet" href="controls/equalizer.css?v=contracts1">
  <link rel="stylesheet" href="controls/player.css?v=contracts1">

<body data-phase="ready">
<main class="app" aria-label="Музыкальная головоломка">
  <section class="playfield" aria-label="Головоломка и музыкальный рисунок">
    <div class="orbital-workspace" id="orbital-workspace">
      <aside class="completion" aria-label="Прогресс сборки"><span id="correct-count">0</span><span>деталей<br>на месте</span></aside>
      <aside class="orbit-legend" aria-label="Обозначения рисунка"><span><i class="legend-note" aria-hidden="true"></i>сейчас</span><span><i class="legend-ghost" aria-hidden="true"></i>цель</span></aside>
      <div class="orbit-sequencer" id="orbit-sequencer">
        <svg id="orbit-score" viewBox="0 0 760 760" role="img" aria-label="Текущий рисунок и контуры цели"></svg>
        <div class="puzzle-stage" id="puzzle-stage" tabindex="0"></div>
      </div>
    </div>
  </section>
  <section class="controls-dock" id="player-controls" aria-label="Управление"></section>
</main>
<div id="dialogs"></div>
<output id="audio-diagnostics" hidden aria-hidden="true"></output>
